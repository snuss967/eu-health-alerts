name: FDA firm profile updates → email

"on":
  schedule:
    - cron: "15 */6 * * *"   # every 6 hours (UTC), offset from the HERA checker
  workflow_dispatch: {}

permissions:
  contents: write             # needed to commit the state file back to the repo

jobs:
  check-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      - name: Run FDA firm profile checker
        id: check
        env:
          FDA_FIRM_PROFILE_URL: "https://datadashboard.fda.gov/oii/firmprofile.htm?FEIi=3013702557&/identity/3013702557"
          FDA_FEI_NUMBER: "3013702557"
          STATE_FILE: .fda_firmprofile_state.json
          NOTIFY_ON_FIRST_RUN: "false"          # change to "true" if you want an initial blast
          REQUIRE_FDA_API: "false"              # set to "true" to fail unless API credentials are configured
          FDA_DD_AUTH_USER: ${{ secrets.FDA_DD_AUTH_USER }}
          FDA_DD_AUTH_KEY: ${{ secrets.FDA_DD_AUTH_KEY }}
        run: |
          python .github/scripts/check_fda_firm_profile_updates.py

      - name: Commit updated FDA state (if changed)
        if: steps.check.outputs.state_changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .fda_firmprofile_state.json
          git commit -m "Update FDA firm profile state [skip ci]" || echo "No changes to commit"
          git push

      - name: Send email (if FDA firm profile changed)
        if: steps.check.outputs.has_updates == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          from: FDA Firm Profile Updates Bot <${{ secrets.GMAIL_USERNAME }}>
          to: ${{ secrets.ALERT_RECIPIENTS }}
          subject: ${{ steps.check.outputs.email_subject }}
          content_type: text/plain
          body: ${{ steps.check.outputs.email_body }}
